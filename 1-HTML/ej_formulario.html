<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<form action="">

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
    <p>
        Nombre: 
        <input type="text" name="Nombre" placeholder="Ingrese su nombre"/>
    </p> 
    <p>
        Apellido: 
        <input type="text" name="Apellido" placeholder="Ingrese su apellido"/>
    </p> 
    <p>
        Sexo: 
        Masculino <input type="radio" name="sex"/> 
        Femenino <input type="radio" name="sex"/>
    </p>
    <p>
        Edad: <input type="number" min="16" max="99"/>
    </p>
    <p>
        Email: <input type="email" name="email"/>
    </p>
    <p>
        Usuario: <input type="text" name="Usuario"/>
    </p>
    <p>
        Password: <input type="password" name="contrasenia"/>
    </p>
    <p>
        Confirmar Password: <input type="password" name="contrasenia">
    </p>


    <p>
            Tipo de servicio: 
            Free <input type="radio" name="servicios"> / 
            Standard  <input type="radio" name="servicios">/
            Premium <input type="radio" name="servicios">
    </p>
    
    <p>Tema:</p>
    <p>Política</p>
    <p>Negocios</p>
    <p>Tecnología</p>
    <p>Salud</p>

    <p>
        Agregue un comentario:
    </p>

    <p>
        <textarea>
            Deje su comentario....
        </textarea>
    </p>

    <button>Boton de Enviar</button>

</form>

</body>
</html>
